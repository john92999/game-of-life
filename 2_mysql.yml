apiVersion: v1
kind: Pod
metadata:
  name: mysql
  namespace: release
spec:
  containers:
    - image: mysql:9
      name: mysql
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: "admin"
        - name: MYSQL_DATABASE
          value: "testdb"
        - name: MYSQL_USER
          value: "admin"
        - name: MYSQL_PASSWORD
          value: "admin"
      ports:
        - containerPort: 3306
          protocol: TCP
      volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
  volumes:
    - name: mysql-storage
      persistentVolumeClaim:
        claimName: mysql-pvc
